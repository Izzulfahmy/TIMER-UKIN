<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Timer Ukin</title>
    <!-- Library PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000; color: #ffffff; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none;
        }

        .status {
            position: absolute; top: 10px; width: 100%; text-align: center;
            font-size: 0.8rem; font-weight: 700; color: #aaaaaa;
        }
        .status.connected { color: #4cd137; }
        .status.error { color: #e84118; }

        .container {
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; width: 100%; padding: 20px;
        }

        .title {
            font-size: 6vw; font-weight: 800; text-align: center; margin-bottom: 20px;
            color: #f5f6fa; line-height: 1.2;
        }

        .timer-main {
            font-size: 22vw; font-weight: 900; line-height: 1; margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }
        
        .timer-total {
            font-size: 10vw; font-weight: 700; color: #7f8fa6; margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex; gap: 15px; width: 100%; justify-content: center;
        }

        .btn {
            background-color: #ffffff; color: #000000; border: none; border-radius: 50px;
            height: 70px; flex: 1; max-width: 150px; font-size: 1.2rem; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2); transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-outline {
            background-color: transparent; border: 3px solid #ffffff; color: #ffffff;
            box-shadow: none;
        }
        .btn svg { width: 28px; height: 28px; fill: currentColor; margin-right: 8px; }

    </style>
</head>
<body>

    <div class="status" id="statusText">Menghubungkan ke Laptop...</div>

    <div class="container">
        <div class="title" id="sintaksTitle">-</div>
        <div class="timer-main" id="timerMain">00:00:00</div>
        <div class="timer-total" id="timerTotal">00:00:00</div>

        <div class="controls">
            <button class="btn btn-outline" onclick="sendCommand('RESET')" id="btnReset" disabled>
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8zm-1 12H11V8h2v9z"/></svg> Reset
            </button>
            <button class="btn" onclick="sendCommand('TOGGLE')" id="btnToggle" disabled>
                <svg viewBox="0 0 24 24" id="iconPlay"><path d="M8 5v14l11-7z"/></svg> Mulai
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('id');
        
        const statusEl = document.getElementById('statusText');
        const titleEl = document.getElementById('sintaksTitle');
        const timerMainEl = document.getElementById('timerMain');
        const timerTotalEl = document.getElementById('timerTotal');
        const btnToggle = document.getElementById('btnToggle');
        const btnReset = document.getElementById('btnReset');
        const iconPlayPath = "M8 5v14l11-7z";
        const iconPausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        if (!hostId) {
            statusEl.innerText = 'Error: ID Laptop tidak ditemukan di URL.';
            statusEl.className = 'status error';
        } else {
            let peer = new Peer();
            let conn = null;

            peer.on('open', () => {
                // Koneksikan ke Host ID (Laptop)
                conn = peer.connect(hostId);

                conn.on('open', () => {
                    statusEl.innerText = 'Terhubung!';
                    statusEl.className = 'status connected';
                    btnToggle.disabled = false;
                    btnReset.disabled = false;
                });

                // Menerima data stream presisi milidetik dari laptop
                conn.on('data', (data) => {
                    titleEl.innerText = data.title;
                    timerMainEl.innerText = data.timer;
                    timerTotalEl.innerText = data.total;
                    
                    if (data.isRunning) {
                        btnToggle.innerHTML = `<svg viewBox="0 0 24 24"><path d="${iconPausePath}"/></svg> Jeda`;
                    } else {
                        btnToggle.innerHTML = `<svg viewBox="0 0 24 24"><path d="${iconPlayPath}"/></svg> Mulai`;
                    }
                });

                conn.on('close', () => {
                    statusEl.innerText = 'Koneksi Terputus.';
                    statusEl.className = 'status error';
                    btnToggle.disabled = true;
                    btnReset.disabled = true;
                });
            });

            peer.on('error', (err) => {
                statusEl.innerText = 'Gagal menghubungkan: ' + err.type;
                statusEl.className = 'status error';
            });
        }

        function sendCommand(cmd) {
            if (conn && conn.open) {
                conn.send(cmd);
            }
        }
    </script>
</body>
</html>
