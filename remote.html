<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Timer Ukin</title>
    <!-- Library PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000; color: #ffffff; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none;
        }

        .status {
            position: absolute; top: 10px; width: 100%; text-align: center;
            font-size: 0.85rem; font-weight: 700; color: #aaaaaa; padding: 10px;
        }
        .status.connected { color: #4cd137; }
        .status.error { color: #f1c40f; } /* Warna peringatan kuning untuk loading */

        .container {
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; width: 100%; padding: 20px;
        }

        .title {
            font-size: 6vw; font-weight: 800; text-align: center; margin-bottom: 20px;
            color: #f5f6fa; line-height: 1.2; min-height: 2em;
        }

        .timer-main {
            font-size: 22vw; font-weight: 900; line-height: 1; margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }
        
        .timer-total {
            font-size: 10vw; font-weight: 700; color: #7f8fa6; margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex; gap: 15px; width: 100%; justify-content: center;
        }

        .btn {
            background-color: #ffffff; color: #000000; border: none; border-radius: 50px;
            height: 70px; flex: 1; max-width: 150px; font-size: 1.2rem; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2); transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-outline {
            background-color: transparent; border: 3px solid #ffffff; color: #ffffff;
            box-shadow: none;
        }
        .btn svg { width: 28px; height: 28px; fill: currentColor; margin-right: 8px; }

    </style>
</head>
<body>

    <div class="status error" id="statusText">Mencari Timer Aktif...</div>

    <div class="container">
        <div class="title" id="sintaksTitle">Menunggu...</div>
        <div class="timer-main" id="timerMain">--:--:--</div>
        <div class="timer-total" id="timerTotal">--:--:--</div>

        <div class="controls">
            <button class="btn btn-outline" onclick="sendCommand('RESET')" id="btnReset" disabled>
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8zm-1 12H11V8h2v9z"/></svg> Reset
            </button>
            <button class="btn" onclick="sendCommand('TOGGLE')" id="btnToggle" disabled>
                <svg viewBox="0 0 24 24" id="iconPlay"><path d="M8 5v14l11-7z"/></svg> Mulai
            </button>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('statusText');
        const titleEl = document.getElementById('sintaksTitle');
        const timerMainEl = document.getElementById('timerMain');
        const timerTotalEl = document.getElementById('timerTotal');
        const btnToggle = document.getElementById('btnToggle');
        const btnReset = document.getElementById('btnReset');
        const iconPlayPath = "M8 5v14l11-7z";
        const iconPausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        // HARUS SAMA DENGAN STATIC ID DI LAPTOP
        const TARGET_HOST_ID = "timer-ukin-izzul-host-2026"; 
        
        let peer = null;
        let conn = null;
        let retryInterval = null;

        function initializePeer() {
            peer = new Peer({
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                connectToHost();
            });

            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    statusEl.innerText = 'Mencari Laptop... (Auto Retry)';
                    statusEl.className = 'status error';
                    // Coba konek ulang setiap 3 detik jika laptop belum nyala
                    if(!retryInterval) {
                        retryInterval = setTimeout(() => { connectToHost(); }, 3000);
                    }
                } else {
                    statusEl.innerText = 'Error: ' + err.type;
                }
            });
        }

        function connectToHost() {
            clearTimeout(retryInterval);
            retryInterval = null;
            
            conn = peer.connect(TARGET_HOST_ID, { reliable: true });

            conn.on('open', () => {
                statusEl.innerText = 'Berhasil Terhubung ke Laptop!';
                statusEl.className = 'status connected';
                btnToggle.disabled = false;
                btnReset.disabled = false;
                if (navigator.vibrate) navigator.vibrate(100); // Getar sukses
            });

            conn.on('data', (data) => {
                titleEl.innerText = data.title;
                timerMainEl.innerText = data.timer;
                timerTotalEl.innerText = data.total;
                
                if (data.isRunning) {
                    btnToggle.innerHTML = `<svg viewBox="0 0 24 24"><path d="${iconPausePath}"/></svg> Jeda`;
                } else {
                    btnToggle.innerHTML = `<svg viewBox="0 0 24 24"><path d="${iconPlayPath}"/></svg> Mulai`;
                }
            });

            conn.on('close', () => {
                statusEl.innerText = 'Koneksi Terputus. Menunggu Laptop...';
                statusEl.className = 'status error';
                btnToggle.disabled = true;
                btnReset.disabled = true;
                // Coba auto reconnect lagi saat laptop terputus
                retryInterval = setTimeout(() => { connectToHost(); }, 3000);
            });
        }

        // Fungsi kirim perintah
        function sendCommand(cmd) {
            if (conn && conn.open) {
                conn.send(cmd);
                if (navigator.vibrate) navigator.vibrate(50); // Getar klik
            }
        }

        // Mulai proses
        initializePeer();
    </script>
</body>
</html>
