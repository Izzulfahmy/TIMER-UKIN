<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Sukses Ukin</title>
    <!-- Library untuk WebRTC (P2P) dan QR Code -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            overflow: hidden; user-select: none; background-color: #ffffff;
            position: relative;
        }

        /* Tombol QR Kiri Atas */
        .qr-btn {
            position: absolute; top: 2vh; left: 2vw;
            width: 32px; height: 32px;
            background: transparent; border: 2px solid #000000; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 50; opacity: 0.15; transition: all 0.3s ease;
        }
        .qr-btn:hover { opacity: 1; background-color: #000000; }
        .qr-btn svg { width: 16px; height: 16px; fill: #000000; transition: fill 0.3s ease; }
        .qr-btn:hover svg { fill: #ffffff; }
        .qr-btn:active { transform: scale(0.92); }

        /* Tombol Fullscreen Kanan Atas */
        .fullscreen-btn {
            position: absolute; top: 2vh; right: 2vw;
            width: 32px; height: 32px;
            background: transparent; border: 2px solid #000000; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 50; opacity: 0.15; transition: all 0.3s ease;
        }
        .fullscreen-btn:hover { opacity: 1; background-color: #000000; }
        .fullscreen-btn svg { width: 16px; height: 16px; fill: #000000; transition: fill 0.3s ease; }
        .fullscreen-btn:hover svg { fill: #ffffff; }
        .fullscreen-btn:active { transform: scale(0.92); }

        /* Timer Utama */
        .section-interval {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 2.2; width: 100%; background-color: #ffffff; color: #000000; padding: 1vh 2vw;
        }
        .sintaks-title {
            font-size: 6.5vw; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em;
            text-align: center; margin-bottom: 0.5vh; line-height: 1.05; width: 95%; word-wrap: break-word;
        }
        #display { font-size: 16vw; font-weight: 900; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; text-align: center; width: 100%; }

        /* Timer Bawah */
        .section-total {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1.1; width: 100%; background-color: #000000; color: #ffffff; border-top: 4px solid #000000;
        }
        #totalDisplay { font-size: 13vw; font-weight: 900; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; text-align: center; width: 100%; }

        /* Tombol Kontrol Bawah */
        .floating-controls {
            position: absolute; bottom: 1.5vh; right: 2vw;
            display: flex; gap: 6px; z-index: 50; opacity: 0.2; transition: opacity 0.3s ease;
        }
        .floating-controls:hover { opacity: 1; }
        .btn {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border: 2px solid #ffffff; background-color: #ffffff; color: #000000;
            border-radius: 6px; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-outline { background-color: transparent; color: #ffffff; border-color: #ffffff; }
        .btn:hover { background-color: #dddddd; color: #000000; }
        .btn-outline:hover { background-color: #ffffff; color: #000000; }
        .btn:active { transform: scale(0.92); }
        .btn svg { width: 16px; height: 16px; fill: currentColor; }
        .btn-text { font-size: 0.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }

        /* Hitung Mundur & Banner Selesai */
        .countdown-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center;
            z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .countdown-overlay.active { opacity: 1; }
        .countdown-number { font-size: 50vw; font-weight: 900; color: #ffffff; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .countdown-number.banner-selesai { font-size: 10vw; text-align: center; color: #ff4444; letter-spacing: 0.02em; text-shadow: 0 5px 20px rgba(0,0,0,0.9); }

        /* Modal Umum */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal {
            position: relative; background: #ffffff; color: #000000; border: 3px solid #000000;
            border-radius: 12px; padding: 24px; width: 90%; max-width: 540px; max-height: 85vh;
            overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .modal-close-btn {
            position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
            background: transparent; border: 2px solid #000000; border-radius: 6px;
            font-size: 1.2rem; font-weight: 800; line-height: 1; color: #000000;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .modal-close-btn:hover { background: #000000; color: #ffffff; }
        .modal h2 { font-size: 1.4rem; margin-bottom: 16px; border-bottom: 2px solid #000000; padding-bottom: 6px; }
        
        /* QR Khusus */
        #qrcode { margin-top: 16px; display: flex; justify-content: center; padding: 10px; background: #fff; border-radius: 8px; }
        .connection-status { font-size: 0.85rem; font-weight: 700; text-align: center; margin-top: 10px; padding: 6px; border-radius: 6px;}
        .status-wait { background: #fff3cd; color: #856404; }
        .status-connected { background: #d4edda; color: #155724; }

        /* Komponen Input */
        .input-group-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .input-field { display: flex; flex-direction: column; flex: 1; }
        .input-field label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        input[type="number"], input[type="text"] {
            padding: 8px; font-size: 0.95rem; font-weight: 600; border: 2px solid #000000; border-radius: 6px;
        }
        input[type="number"] { text-align: center; }
        .interval-list { margin-top: 12px; margin-bottom: 16px; }
        .interval-item { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; background: #f8f8f8; padding: 8px; border-radius: 6px; border: 1px solid #ddd; }
        .interval-item input[type="text"] { flex: 2; }
        .interval-item input[type="number"] { width: 50px; }
        .btn-del { background: #000000; color: #ffffff; border: none; border-radius: 4px; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-weight: 600; font-size: 0.95rem; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: #000000; }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    </style>
</head>
<body>

    <!-- Tombol QR Code (Kiri Atas) -->
    <button class="qr-btn" onclick="openQRModal()" title="Lihat Link Remote">
        <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v2h-3v-2zm-2 3h2v2h-2v-2zm-3-3h2v2h-2v-2zm3 3h3v2h-3v-2zm-3-3h2v2h-2v-2z"/></svg>
    </button>

    <!-- Tombol Fullscreen (Kanan Atas) -->
    <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Layar Penuh (Tekan F)">
        <svg id="fullscreenIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>

    <div class="section-interval">
        <div class="sintaks-title" id="sintaksTitle">Salam, lagu nasional, kehadiran, kerapihan, icebreaking, apersepsi, tujuan pembelajaran</div>
        <div id="display">00:09:00</div>
    </div>

    <div class="section-total" id="sectionTotal">
        <div id="totalDisplay">01:14:00</div>
    </div>

    <!-- Tombol Kontrol -->
    <div class="floating-controls">
        <button class="btn btn-outline" onclick="adjustTime(-10)" title="Kurangi 10 Detik"><span class="btn-text">-10</span></button>
        <button class="btn btn-outline" onclick="adjustTime(-5)" title="Kurangi 5 Detik"><span class="btn-text">-5</span></button>
        <button class="btn btn-outline" onclick="adjustTime(5)" title="Tambah 5 Detik"><span class="btn-text">+5</span></button>
        <button class="btn btn-outline" onclick="adjustTime(10)" title="Tambah 10 Detik"><span class="btn-text">+10</span></button>
        
        <button class="btn" id="startBtn" onclick="toggleTimer()" title="Mulai / Jeda (Spasi)">
            <svg viewBox="0 0 24 24"><path id="startIconPath" d="M8 5v14l11-7z"/></svg>
        </button>
        
        <button class="btn btn-outline" onclick="resetTimer()" title="Reset (Tekan R)">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8zm-1 12H11V8h2v9z"/></svg>
        </button>
        
        <button class="btn btn-outline" onclick="openSettings()" title="Pengaturan (Tekan P)">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
    </div>
    
    <div class="countdown-overlay" id="countdownOverlay"><div class="countdown-number" id="countdownNumber">10</div></div>

    <!-- Modal QR Code -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal" style="text-align: center; max-width: 400px;">
            <button class="modal-close-btn" onclick="closeQRModal()">✕</button>
            <h2>Remote HP Control</h2>
            <p style="font-size: 0.85rem; font-weight:600; margin-bottom: 10px;">Buka link di bawah ini di HP Anda atau scan QR:</p>
            
            <div class="input-field" style="text-align: left; margin-bottom: 10px;">
                <input type="text" id="hostUrlInput" readonly style="background: #f0f0f0; text-align:center;">
                <small style="font-size: 0.75rem; color: #666; margin-top: 4px; display:block; text-align:center;">Link ini permanen statis. Bookmark di HP Anda!</small>
            </div>

            <div id="qrcode"></div>
            <div id="remoteStatus" class="connection-status status-wait">Menunggu koneksi HP...</div>
        </div>
    </div>

    <!-- Modal Pengaturan Timer -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close-btn" onclick="closeSettings()">✕</button>
            <h2>Pengaturan Timer Ukin</h2>
            <div class="checkbox-group"><input type="checkbox" id="enableIntervals" onchange="toggleIntervalMode()" checked><label for="enableIntervals">Gunakan Sintaks Beruntun</label></div>
            <div class="checkbox-group"><input type="checkbox" id="showTotalTimer" onchange="toggleTotalTimerVisibility()" checked><label for="showTotalTimer">Tampilkan Waktu Bawah</label></div>
            
            <div id="singleTimerSettings" style="display: none;">
                <div class="input-group-row">
                    <div class="input-field"><label>Jam</label><input type="number" id="hours" min="0" max="99" value="01"></div>
                    <div class="input-field"><label>Menit</label><input type="number" id="minutes" min="0" max="59" value="15"></div>
                    <div class="input-field"><label>Detik</label><input type="number" id="seconds" min="0" max="59" value="00"></div>
                </div>
            </div>

            <div id="intervalTimerSettings">
                <label style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Daftar Sintaks / Tahapan:</label>
                <div class="interval-list" id="intervalContainer"></div>
                <button class="btn btn-outline" style="background:#000; color:#fff; width: 100%; font-size: 0.85rem; padding: 6px; margin-bottom: 10px;" onclick="addIntervalItem()">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Tambah Sintaks
                </button>
            </div>
            <div style="margin-top: 10px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn" style="background:#000; color:#fff; width:auto; padding: 8px 16px;" onclick="saveSettings()">Simpan & Terapkan</button>
            </div>
        </div>
    </div>

    <script>
        // ==== VARIABEL TIMER ====
        let countdown;
        let isRunning = false;
        let isIntervalMode = true;
        let totalSeconds = 0;
        let grandTotalSeconds = 0;
        let targetEndTimeInterval = null;
        let targetEndTimeGrandTotal = null;
        let remainingIntervalMs = 0;
        let remainingTotalMs = 0;
        let wakeLock = null; 
        
        const playIconPath = "M8 5v14l11-7z";
        const pauseIconPath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        let intervals = [
            { name: "Salam, lagu nasional, kehadiran, kerapihan, icebreaking, apersepsi, tujuan pembelajaran", h: 0, m: 9, s: 0 },
            { name: "Sintak 1: Orientasi Murid pada Masalah", h: 0, m: 10, s: 0 },
            { name: "Sintak 2: Mengorganisasi Murid untuk Belajar", h: 0, m: 5, s: 0 },
            { name: "Sintak 3: Membimbing Penyelidikan Individu maupun Kelompok", h: 0, m: 15, s: 0 },
            { name: "Sintak 4: Mengembangkan dan Menyajikan Hasil Karya", h: 0, m: 12, s: 0 },
            { name: "Sintak 5: Menganalisis dan Evaluasi Proses Pemecahan Masalah", h: 0, m: 8, s: 0 },
            { name: "Penguatan, refleksi, doa, salam penutup", h: 0, m: 10, s: 0 }
        ];
        let currentIntervalIndex = 0;

        const displayEl = document.getElementById('display');
        const totalDisplayEl = document.getElementById('totalDisplay');
        const sintaksTitleEl = document.getElementById('sintaksTitle');
        const startIconPathEl = document.getElementById('startIconPath');

        // ==== LOGIKA WEBRTC / PEERJS DENGAN STATIC ID RAHASIA ====
        const HOST_STATIC_ID = "timer-ukin-izzul-host-2026"; // ID Kunci Statis
        
        let peer = new Peer(HOST_STATIC_ID, {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });
        
        let remoteConnection = null;
        let qrCodeInstance = null;

        peer.on('open', (id) => {
            console.log('Host Siap dengan ID Statis:', id);
        });

        // Error jika ternyata laptop membuka 2 tab sekaligus
        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') {
                alert('Timer sudah terbuka di tab lain! Harap tutup tab/jendela yang ganda.');
            }
        });

        // Event saat HP berhasil menembus koneksi
        peer.on('connection', (conn) => {
            conn.on('open', () => {
                remoteConnection = conn;
                document.getElementById('remoteStatus').className = 'connection-status status-connected';
                document.getElementById('remoteStatus').innerText = 'HP Terhubung! Sinkronisasi Aktif.';
                sendSyncData(); // Berikan data timer ke HP seketika
            });

            // Menerima eksekusi tombol dari HP
            conn.on('data', (command) => {
                if (command === 'TOGGLE') toggleTimer();
                else if (command === 'RESET') resetTimer();
            });

            conn.on('close', () => {
                if (remoteConnection === conn) {
                    remoteConnection = null;
                    document.getElementById('remoteStatus').className = 'connection-status status-wait';
                    document.getElementById('remoteStatus').innerText = 'Menunggu koneksi HP...';
                }
            });
        });

        function sendSyncData() {
            if (remoteConnection && remoteConnection.open) {
                remoteConnection.send({
                    title: sintaksTitleEl.textContent,
                    timer: displayEl.textContent,
                    total: totalDisplayEl.textContent,
                    isRunning: isRunning
                });
            }
        }

        // ==== FUNGSI QR CODE ====
        function openQRModal() {
            document.getElementById('qrModal').classList.add('active');
            
            // Format URL menjadi link statis bersih
            let baseUrl = window.location.href.split('?')[0].replace('index.html', '');
            if(!baseUrl.endsWith('/')) baseUrl += '/';
            const remoteUrl = `${baseUrl}remote.html`;
            
            document.getElementById('hostUrlInput').value = remoteUrl;
            
            if(!qrCodeInstance) {
                document.getElementById('qrcode').innerHTML = "";
                qrCodeInstance = new QRCode(document.getElementById("qrcode"), {
                    text: remoteUrl, width: 200, height: 200,
                    colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
                });
            }
        }
        function closeQRModal() { document.getElementById('qrModal').classList.remove('active'); }

        // ==== LOGIKA TIMER UTAMA ====
        async function requestWakeLock() {
            if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        }
        function releaseWakeLock() { if (wakeLock !== null) wakeLock.release().then(() => wakeLock = null); }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err=>{});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function formatTime(seconds) {
            if (seconds < 0) seconds = 0;
            const hrs = Math.floor(seconds / 3600); const mins = Math.floor((seconds % 3600) / 60); const secs = seconds % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay() {
            displayEl.textContent = formatTime(Math.max(0, totalSeconds));
            totalDisplayEl.textContent = formatTime(Math.max(0, grandTotalSeconds));
            document.title = `${formatTime(Math.max(0, totalSeconds))} - Timer Sukses Ukin`;
            
            sendSyncData();

            const overlay = document.getElementById('countdownOverlay');
            const numEl = document.getElementById('countdownNumber');
            
            if (grandTotalSeconds <= 10 && grandTotalSeconds > 0) {
                overlay.classList.add('active');
                numEl.className = 'countdown-number'; numEl.textContent = grandTotalSeconds;
            } else if (grandTotalSeconds <= 0) {
                overlay.classList.add('active');
                numEl.className = 'countdown-number banner-selesai'; numEl.innerHTML = 'PEMBELAJARAN<br>SELESAI';
            } else { overlay.classList.remove('active'); }
        }

        function toggleTimer() { isRunning ? pauseTimer() : startTimer(); }

        function startTimer() {
            if (!isRunning) {
                if (totalSeconds <= 0 && grandTotalSeconds <= 0) return;
                isRunning = true;
                startIconPathEl.setAttribute('d', pauseIconPath); 
                requestWakeLock();
                const now = Date.now();
                if (remainingIntervalMs > 0 || remainingTotalMs > 0) {
                    targetEndTimeInterval = now + remainingIntervalMs; targetEndTimeGrandTotal = now + remainingTotalMs;
                } else {
                    targetEndTimeInterval = now + (totalSeconds * 1000); targetEndTimeGrandTotal = now + (grandTotalSeconds * 1000);
                }
                countdown = setInterval(tick, 100);
                sendSyncData();
            }
        }

        function tick() {
            if (!isRunning) return;
            const now = Date.now();
            totalSeconds = Math.ceil((targetEndTimeInterval - now) / 1000);
            grandTotalSeconds = Math.ceil((targetEndTimeGrandTotal - now) / 1000);

            if (isIntervalMode) {
                while (totalSeconds <= 0 && currentIntervalIndex < intervals.length - 1) {
                    currentIntervalIndex++; const item = intervals[currentIntervalIndex];
                    const nextDuration = (item.h * 3600) + (item.m * 60) + item.s;
                    targetEndTimeInterval += (nextDuration * 1000);
                    sintaksTitleEl.textContent = item.name;
                    totalSeconds = Math.ceil((targetEndTimeInterval - now) / 1000);
                }
            }
            updateDisplay();

            if (grandTotalSeconds <= 0 && totalSeconds <= 0) {
                clearInterval(countdown); isRunning = false;
                startIconPathEl.setAttribute('d', playIconPath); releaseWakeLock(); sendSyncData();
            }
        }

        function adjustTime(seconds) {
            let wasRunning = isRunning;
            if (!isRunning) {
                isRunning = true; const now = Date.now();
                if (remainingIntervalMs === 0 && remainingTotalMs === 0) {
                    targetEndTimeInterval = now + (totalSeconds * 1000); targetEndTimeGrandTotal = now + (grandTotalSeconds * 1000);
                } else {
                    targetEndTimeInterval = now + remainingIntervalMs; targetEndTimeGrandTotal = now + remainingTotalMs;
                }
            }
            targetEndTimeInterval += (seconds * 1000); targetEndTimeGrandTotal += (seconds * 1000);
            tick();
            if (!wasRunning) {
                isRunning = false; const now = Date.now();
                remainingIntervalMs = targetEndTimeInterval - now; remainingTotalMs = targetEndTimeGrandTotal - now; updateDisplay();
            }
        }

        function pauseTimer() {
            clearInterval(countdown); isRunning = false;
            startIconPathEl.setAttribute('d', playIconPath); releaseWakeLock(); 
            const now = Date.now();
            remainingIntervalMs = targetEndTimeInterval - now; remainingTotalMs = targetEndTimeGrandTotal - now; sendSyncData();
        }

        function resetTimer() {
            clearInterval(countdown); isRunning = false;
            startIconPathEl.setAttribute('d', playIconPath); releaseWakeLock(); 
            remainingIntervalMs = 0; remainingTotalMs = 0;
            if (isIntervalMode) {
                currentIntervalIndex = 0; calculateGrandTotalFromIntervals(); loadIntervalSintaks(currentIntervalIndex);
            } else {
                const h = parseInt(document.getElementById('hours').value) || 0; const m = parseInt(document.getElementById('minutes').value) || 0; const s = parseInt(document.getElementById('seconds').value) || 0;
                totalSeconds = (h * 3600) + (m * 60) + s; grandTotalSeconds = totalSeconds;
                sintaksTitleEl.textContent = "TIMER UKIN"; updateDisplay();
            }
            sendSyncData();
        }

        function calculateGrandTotalFromIntervals() { grandTotalSeconds = intervals.reduce((acc, item) => acc + (item.h * 3600) + (item.m * 60) + item.s, 0); }
        function loadIntervalSintaks(index) {
            const item = intervals[index]; totalSeconds = (item.h * 3600) + (item.m * 60) + item.s;
            sintaksTitleEl.textContent = item.name; updateDisplay();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isRunning) requestWakeLock();
            if (!document.hidden && isRunning) tick();
        });

        // ==== PENGATURAN ====
        function openSettings() { renderIntervalInputs(); document.getElementById('modalOverlay').classList.add('active'); }
        function closeSettings() { document.getElementById('modalOverlay').classList.remove('active'); }

        document.addEventListener('keydown', (e) => {
            const isInput = document.activeElement.tagName === 'INPUT';
            if (document.getElementById('modalOverlay').classList.contains('active') || document.getElementById('qrModal').classList.contains('active')) {
                if (e.key === 'Escape') { closeSettings(); closeQRModal(); } return; 
            }
            if (isInput) return;
            if (e.code === 'Space') { e.preventDefault(); toggleTimer(); } 
            else if (e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); } 
            else if (e.key.toLowerCase() === 'r') { e.preventDefault(); resetTimer(); } 
            else if (e.key.toLowerCase() === 'p') { e.preventDefault(); openSettings(); }
        });

        function toggleIntervalMode() {
            const checked = document.getElementById('enableIntervals').checked;
            document.getElementById('singleTimerSettings').style.display = checked ? 'none' : 'block';
            document.getElementById('intervalTimerSettings').style.display = checked ? 'block' : 'none';
        }
        function toggleTotalTimerVisibility() { document.getElementById('sectionTotal').style.display = document.getElementById('showTotalTimer').checked ? 'flex' : 'none'; }
        function renderIntervalInputs() {
            const container = document.getElementById('intervalContainer'); container.innerHTML = '';
            intervals.forEach((item, idx) => {
                const div = document.createElement('div'); div.className = 'interval-item';
                div.innerHTML = `
                    <input type="text" value="${item.name}" onchange="intervals[${idx}].name = this.value">
                    <input type="number" value="${item.h}" min="0" onchange="intervals[${idx}].h = parseInt(this.value)||0">
                    <input type="number" value="${item.m}" min="0" max="59" onchange="intervals[${idx}].m = parseInt(this.value)||0">
                    <input type="number" value="${item.s}" min="0" max="59" onchange="intervals[${idx}].s = parseInt(this.value)||0">
                    <button class="btn-del" onclick="removeIntervalItem(${idx})">×</button>`;
                container.appendChild(div);
            });
        }
        function addIntervalItem() { intervals.push({ name: `Sintaks ${intervals.length + 1}`, h: 0, m: 10, s: 0 }); renderIntervalInputs(); }
        function removeIntervalItem(idx) { if (intervals.length > 1) { intervals.splice(idx, 1); renderIntervalInputs(); } }
        function saveSettings() { isIntervalMode = document.getElementById('enableIntervals').checked; toggleTotalTimerVisibility(); closeSettings(); resetTimer(); }

        resetTimer();
    </script>
</body>
</html>
