<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Hitung Mundur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* Form Input Waktu */
        .controls {
            position: absolute;
            top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="number"] {
            width: 70px;
            padding: 8px 10px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid #000000;
            border-radius: 6px;
            outline: none;
            text-align: center;
            background: #ffffff;
            color: #000000;
        }

        /* Menyembunyikan panah input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        label {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button {
            padding: 8px 18px;
            font-size: 1rem;
            font-weight: 700;
            border: 2px solid #000000;
            background-color: #000000;
            color: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        button:active {
            transform: scale(0.97);
        }

        /* Display Timer Besar Fit Layar */
        .timer-display {
            font-size: 26vw;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
            text-align: center;
            width: 100%;
        }

        /* Menyembunyikan kontrol saat timer berjalan agar lebih bersih (opsional) */
        body.is-running .controls {
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }
        body.is-running .controls:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <input type="number" id="minutes" min="0" max="999" value="05" placeholder="00">
            <label for="minutes">Menit</label>
        </div>
        <div class="input-group">
            <input type="number" id="seconds" min="0" max="59" value="00" placeholder="00">
            <label for="seconds">Detik</label>
        </div>
        <button id="startBtn" onclick="toggleTimer()">Mulai</button>
        <button onclick="resetTimer()">Reset</button>
    </div>

    <div class="timer-display" id="display">05:00</div>

    <script>
        let countdown;
        let totalSeconds = 300;
        let isRunning = false;

        const displayEl = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');

        function updateDisplay(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const formattedTime = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            displayEl.textContent = formattedTime;
            document.title = `${formattedTime} - Timer`;
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!isRunning) {
                // Ambil nilai input jika timer baru dimulai dari posisi diam
                if (totalSeconds <= 0 || displayEl.textContent === "00:00") {
                    const mins = parseInt(minutesInput.value) || 0;
                    const secs = parseInt(secondsInput.value) || 0;
                    totalSeconds = (mins * 60) + secs;
                }

                if (totalSeconds <= 0) return;

                isRunning = true;
                startBtn.textContent = 'Jeda';
                document.body.classList.add('is-running');

                countdown = setInterval(() => {
                    totalSeconds--;
                    updateDisplay(totalSeconds);

                    if (totalSeconds <= 0) {
                        clearInterval(countdown);
                        isRunning = false;
                        startBtn.textContent = 'Mulai';
                        document.body.classList.remove('is-running');
                        alert('Waktu Habis!');
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.textContent = 'Lanjut';
            document.body.classList.remove('is-running');
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.textContent = 'Mulai';
            document.body.classList.remove('is-running');
            
            const mins = parseInt(minutesInput.value) || 0;
            const secs = parseInt(secondsInput.value) || 0;
            totalSeconds = (mins * 60) + secs;
            updateDisplay(totalSeconds);
        }

        // Format otomatis input agar selalu 2 digit saat diubah
        [minutesInput, secondsInput].forEach(input => {
            input.addEventListener('change', () => {
                if (!isRunning) {
                    let val = parseInt(input.value) || 0;
                    if (input.id === 'seconds' && val > 59) val = 59;
                    input.value = String(val).padStart(2, '0');
                    resetTimer();
                }
            });
        });

        // Inisialisasi tampilan awal
        updateDisplay(totalSeconds);
    </script>
</body>
</html>
