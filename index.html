<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Ukin - Profesional</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* Label Sintaks Pembelajaran */
        .sintaks-title {
            position: absolute;
            top: 5vh;
            font-size: 3vw;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            color: #000000;
        }

        /* Display Utama Timer (Jam:Menit:Detik) Fit Layar */
        .timer-display {
            font-size: 19vw;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
            text-align: center;
            width: 100%;
        }

        /* Tombol Floating untuk Membuka Pengaturan & Control */
        .floating-controls {
            position: absolute;
            bottom: 4vh;
            display: flex;
            gap: 12px;
            z-index: 10;
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        .floating-controls:hover {
            opacity: 1;
        }

        .btn {
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 2.5px solid #000000;
            background-color: #000000;
            color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline {
            background-color: #ffffff;
            color: #000000;
        }

        .btn:hover {
            background-color: #333333;
            color: #ffffff;
        }

        .btn-outline:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Modal Pengaturan */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 12px;
            padding: 28px;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #000000;
            padding-bottom: 8px;
        }

        .input-group-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .input-field label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        input[type="number"], input[type="text"] {
            padding: 8px 10px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid #000000;
            border-radius: 6px;
            outline: none;
            background: #ffffff;
            color: #000000;
        }

        input[type="number"] {
            text-align: center;
        }

        /* Interval / Sintaks Item list */
        .interval-list {
            margin-top: 16px;
            margin-bottom: 20px;
        }

        .interval-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            background: #f8f8f8;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .interval-item input[type="text"] {
            flex: 2;
        }

        .interval-item input[type="number"] {
            width: 55px;
        }

        .btn-del {
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #000000;
        }

        /* Menyembunyikan panah input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <!-- Label Sintaks Aktif -->
    <div class="sintaks-title" id="sintaksTitle"></div>

    <!-- Tampilan Utama Jam:Menit:Detik -->
    <div class="timer-display" id="display">00:05:00</div>

    <!-- Kontrol Bawah (Hover untuk memperjelas) -->
    <div class="floating-controls">
        <button class="btn" id="startBtn" onclick="toggleTimer()">Mulai</button>
        <button class="btn btn-outline" onclick="resetTimer()">Reset</button>
        <button class="btn btn-outline" onclick="openSettings()">Pengaturan</button>
    </div>

    <!-- Modal Pengaturan -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Pengaturan Timer Ukin</h2>

            <div class="checkbox-group">
                <input type="checkbox" id="enableIntervals" onchange="toggleIntervalMode()">
                <label for="enableIntervals">Gunakan Sintaks / Interval Beruntun</label>
            </div>

            <!-- Mode Manual Biasa -->
            <div id="singleTimerSettings">
                <div class="input-group-row">
                    <div class="input-field">
                        <label>Jam</label>
                        <input type="number" id="hours" min="0" max="99" value="00">
                    </div>
                    <div class="input-field">
                        <label>Menit</label>
                        <input type="number" id="minutes" min="0" max="59" value="05">
                    </div>
                    <div class="input-field">
                        <label>Detik</label>
                        <input type="number" id="seconds" min="0" max="59" value="00">
                    </div>
                </div>
            </div>

            <!-- Mode Interval Sintaks -->
            <div id="intervalTimerSettings" style="display: none;">
                <label style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Daftar Sintaks / Tahapan:</label>
                <div class="interval-list" id="intervalContainer">
                    <!-- Item interval akan dirender otomatis via JavaScript -->
                </div>
                <button class="btn btn-outline" style="width: 100%; font-size: 0.9rem; padding: 6px;" onclick="addIntervalItem()">+ Tambah Sintaks</button>
            </div>

            <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn" onclick="saveSettings()">Simpan & Terapkan</button>
            </div>
        </div>
    </div>

    <script>
        let countdown;
        let totalSeconds = 300;
        let isRunning = false;
        let isIntervalMode = false;
        
        let intervals = [
            { name: "Pendahuluan", h: 0, m: 5, s: 0 },
            { name: "Sintaks 1: Orientasi Masalah", h: 0, m: 10, s: 0 },
            { name: "Sintaks 2: Pengorganisasian", h: 0, m: 15, s: 0 },
            { name: "Penutup", h: 0, m: 5, s: 0 }
        ];
        let currentIntervalIndex = 0;

        const displayEl = document.getElementById('display');
        const sintaksTitleEl = document.getElementById('sintaksTitle');
        const startBtn = document.getElementById('startBtn');
        const modalOverlay = document.getElementById('modalOverlay');

        function updateDisplay(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            const formatted = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            displayEl.textContent = formatted;
            document.title = `${formatted} - Timer Ukin`;
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!isRunning) {
                if (totalSeconds <= 0) return;

                isRunning = true;
                startBtn.textContent = 'Jeda';

                countdown = setInterval(() => {
                    totalSeconds--;
                    updateDisplay(totalSeconds);

                    if (totalSeconds <= 0) {
                        clearInterval(countdown);
                        isRunning = false;
                        
                        // Cek jika mode interval aktif dan masih ada sintaks berikutnya
                        if (isIntervalMode && currentIntervalIndex < intervals.length - 1) {
                            currentIntervalIndex++;
                            loadInterval(currentIntervalIndex);
                            startTimer();
                        } else {
                            startBtn.textContent = 'Mulai';
                            alert('Seluruh Rangkaian Waktu Habis!');
                        }
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.textContent = 'Lanjut';
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.textContent = 'Mulai';
            
            if (isIntervalMode) {
                currentIntervalIndex = 0;
                loadInterval(currentIntervalIndex);
            } else {
                const h = parseInt(document.getElementById('hours').value) || 0;
                const m = parseInt(document.getElementById('minutes').value) || 0;
                const s = parseInt(document.getElementById('seconds').value) || 0;
                totalSeconds = (h * 3600) + (m * 60) + s;
                sintaksTitleEl.textContent = "";
                updateDisplay(totalSeconds);
            }
        }

        function loadInterval(index) {
            const item = intervals[index];
            totalSeconds = (item.h * 3600) + (item.m * 60) + item.s;
            sintaksTitleEl.textContent = item.name;
            updateDisplay(totalSeconds);
        }

        /* Modal & Settings Logic */
        function openSettings() {
            pauseTimer();
            renderIntervalInputs();
            modalOverlay.classList.add('active');
        }

        function toggleIntervalMode() {
            const checked = document.getElementById('enableIntervals').checked;
            document.getElementById('singleTimerSettings').style.display = checked ? 'none' : 'block';
            document.getElementById('intervalTimerSettings').style.display = checked ? 'block' : 'none';
        }

        function renderIntervalInputs() {
            const container = document.getElementById('intervalContainer');
            container.innerHTML = '';
            intervals.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'interval-item';
                div.innerHTML = `
                    <input type="text" value="${item.name}" placeholder="Nama Sintaks" onchange="intervals[${idx}].name = this.value">
                    <input type="number" value="${item.h}" min="0" placeholder="J" onchange="intervals[${idx}].h = parseInt(this.value)||0">
                    <input type="number" value="${item.m}" min="0" max="59" placeholder="M" onchange="intervals[${idx}].m = parseInt(this.value)||0">
                    <input type="number" value="${item.s}" min="0" max="59" placeholder="D" onchange="intervals[${idx}].s = parseInt(this.value)||0">
                    <button class="btn-del" onclick="removeIntervalItem(${idx})">×</button>
                `;
                container.appendChild(div);
            });
        }

        function addIntervalItem() {
            intervals.push({ name: `Sintaks ${intervals.length + 1}`, h: 0, m: 10, s: 0 });
            renderIntervalInputs();
        }

        function removeIntervalItem(idx) {
            if (intervals.length > 1) {
                intervals.splice(idx, 1);
                renderIntervalInputs();
            }
        }

        function saveSettings() {
            isIntervalMode = document.getElementById('enableIntervals').checked;
            modalOverlay.classList.remove('active');
            resetTimer();
        }

        // Inisialisasi awal
        resetTimer();
    </script>
</body>
</html>
