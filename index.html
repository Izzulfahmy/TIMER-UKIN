<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Ukin - Dual Kontras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            user-select: none;
            background-color: #ffffff;
        }

        /* Seksi Atas: Timer Sintaks (Background Putih, Teks Hitam) */
        .section-interval {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1.2;
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            padding: 1vh 2vw;
        }

        /* Judul Sintaks Diperbesar Menjadi Extra Large (6.5vw) */
        .sintaks-title {
            font-size: 6.5vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            text-align: center;
            color: #000000;
            margin-bottom: 1vh;
            line-height: 1.05;
            width: 95%;
            word-wrap: break-word;
        }

        /* Seksi Bawah: Timer Keseluruhan (Background Hitam Kontras, Teks Putih) */
        .section-total {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 0.8;
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border-top: 4px solid #000000;
        }

        /* Ukuran Angka Sama Besar Raksasa Fit Layar */
        .timer-display-large {
            font-size: 13vw;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
            text-align: center;
            width: 100%;
        }

        /* Tombol Floating Kontrol & Pengaturan (Pojok Kanan Bawah) */
        .floating-controls {
            position: absolute;
            bottom: 1.5vh;
            right: 2vw;
            display: flex;
            gap: 8px;
            z-index: 10;
            opacity: 0.15;
            transition: opacity 0.3s ease;
        }

        .floating-controls:hover {
            opacity: 1;
        }

        .btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 2px solid #ffffff;
            background-color: #ffffff;
            color: #000000;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            border-color: #ffffff;
        }

        .btn:hover {
            background-color: #dddddd;
            color: #000000;
        }

        .btn-outline:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Modal Pengaturan */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal h2 {
            font-size: 1.4rem;
            margin-bottom: 16px;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
        }

        .input-group-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .input-field label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        input[type="number"], input[type="text"] {
            padding: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 2px solid #000000;
            border-radius: 6px;
            outline: none;
            background: #ffffff;
            color: #000000;
        }

        input[type="number"] {
            text-align: center;
        }

        .interval-list {
            margin-top: 12px;
            margin-bottom: 16px;
        }

        .interval-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            background: #f8f8f8;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .interval-item input[type="text"] {
            flex: 2;
        }

        .interval-item input[type="number"] {
            width: 50px;
        }

        .btn-del {
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #000000;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <!-- Bagian Atas: Timer Sintaks Aktif (Sintaks Title Diperbesar) -->
    <div class="section-interval">
        <div class="sintaks-title" id="sintaksTitle">KEGIATAN PENDAHULUAN</div>
        <div class="timer-display-large" id="display">00:05:00</div>
    </div>

    <!-- Bagian Bawah: Waktu Keseluruhan (Hitam Kontras, Tanpa Judul) -->
    <div class="section-total" id="sectionTotal">
        <div class="timer-display-large" id="totalDisplay">00:35:00</div>
    </div>

    <!-- Kontrol Melayang (Pojok Kanan Bawah) -->
    <div class="floating-controls">
        <button class="btn" id="startBtn" onclick="toggleTimer()">Mulai</button>
        <button class="btn btn-outline" onclick="resetTimer()">Reset</button>
        <button class="btn btn-outline" onclick="openSettings()">Pengaturan</button>
    </div>

    <!-- Modal Pengaturan -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Pengaturan Timer Ukin</h2>

            <div class="checkbox-group">
                <input type="checkbox" id="enableIntervals" onchange="toggleIntervalMode()" checked>
                <label for="enableIntervals">Gunakan Sintaks / Interval Beruntun</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="showTotalTimer" onchange="toggleTotalTimerVisibility()" checked>
                <label for="showTotalTimer">Tampilkan Waktu Keseluruhan di Bawah</label>
            </div>

            <!-- Mode Manual Biasa -->
            <div id="singleTimerSettings" style="display: none;">
                <div class="input-group-row">
                    <div class="input-field">
                        <label>Jam</label>
                        <input type="number" id="hours" min="0" max="99" value="00">
                    </div>
                    <div class="input-field">
                        <label>Menit</label>
                        <input type="number" id="minutes" min="0" max="59" value="35">
                    </div>
                    <div class="input-field">
                        <label>Detik</label>
                        <input type="number" id="seconds" min="0" max="59" value="00">
                    </div>
                </div>
            </div>

            <!-- Mode Interval Sintaks -->
            <div id="intervalTimerSettings">
                <label style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">Daftar Sintaks / Tahapan:</label>
                <div class="interval-list" id="intervalContainer"></div>
                <button class="btn btn-outline" style="background:#000; color:#fff; width: 100%; font-size: 0.85rem; padding: 6px;" onclick="addIntervalItem()">+ Tambah Sintaks</button>
            </div>

            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn" style="background:#000; color:#fff;" onclick="saveSettings()">Simpan & Terapkan</button>
            </div>
        </div>
    </div>

    <script>
        let countdown;
        let isRunning = false;
        let isIntervalMode = true;

        let totalSeconds = 0;
        let grandTotalSeconds = 0;

        let intervals = [
            { name: "Kegiatan Pendahuluan", h: 0, m: 5, s: 0 },
            { name: "Sintaks 1: Orientasi Masalah", h: 0, m: 10, s: 0 },
            { name: "Sintaks 2: Pengorganisasian", h: 0, m: 15, s: 0 },
            { name: "Kegiatan Penutup", h: 0, m: 5, s: 0 }
        ];
        let currentIntervalIndex = 0;

        const displayEl = document.getElementById('display');
        const totalDisplayEl = document.getElementById('totalDisplay');
        const sintaksTitleEl = document.getElementById('sintaksTitle');
        const startBtn = document.getElementById('startBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const sectionTotal = document.getElementById('sectionTotal');

        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay() {
            displayEl.textContent = formatTime(totalSeconds);
            totalDisplayEl.textContent = formatTime(grandTotalSeconds);
            document.title = `${formatTime(totalSeconds)} - Timer Ukin`;
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!isRunning) {
                if (totalSeconds <= 0 && grandTotalSeconds <= 0) return;

                isRunning = true;
                startBtn.textContent = 'Jeda';

                countdown = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                    }

                    if (grandTotalSeconds > 0) {
                        grandTotalSeconds--;
                    }

                    updateDisplay();

                    if (totalSeconds <= 0) {
                        if (isIntervalMode && currentIntervalIndex < intervals.length - 1) {
                            currentIntervalIndex++;
                            loadIntervalSintaks(currentIntervalIndex);
                        } else if (grandTotalSeconds <= 0) {
                            clearInterval(countdown);
                            isRunning = false;
                            startBtn.textContent = 'Mulai';
                            alert('Seluruh Rangkaian Waktu dan Sintaks Habis!');
                        }
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.textContent = 'Lanjut';
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.textContent = 'Mulai';
            
            if (isIntervalMode) {
                currentIntervalIndex = 0;
                calculateGrandTotalFromIntervals();
                loadIntervalSintaks(currentIntervalIndex);
            } else {
                const h = parseInt(document.getElementById('hours').value) || 0;
                const m = parseInt(document.getElementById('minutes').value) || 0;
                const s = parseInt(document.getElementById('seconds').value) || 0;
                totalSeconds = (h * 3600) + (m * 60) + s;
                grandTotalSeconds = totalSeconds;
                sintaksTitleEl.textContent = "TIMER UKIN";
                updateDisplay();
            }
        }

        function calculateGrandTotalFromIntervals() {
            grandTotalSeconds = intervals.reduce((acc, item) => {
                return acc + (item.h * 3600) + (item.m * 60) + item.s;
            }, 0);
        }

        function loadIntervalSintaks(index) {
            const item = intervals[index];
            totalSeconds = (item.h * 3600) + (item.m * 60) + item.s;
            sintaksTitleEl.textContent = item.name;
            updateDisplay();
        }

        function openSettings() {
            pauseTimer();
            renderIntervalInputs();
            modalOverlay.classList.add('active');
        }

        function toggleIntervalMode() {
            const checked = document.getElementById('enableIntervals').checked;
            document.getElementById('singleTimerSettings').style.display = checked ? 'none' : 'block';
            document.getElementById('intervalTimerSettings').style.display = checked ? 'block' : 'none';
        }

        function toggleTotalTimerVisibility() {
            const checked = document.getElementById('showTotalTimer').checked;
            sectionTotal.style.display = checked ? 'flex' : 'none';
        }

        function renderIntervalInputs() {
            const container = document.getElementById('intervalContainer');
            container.innerHTML = '';
            intervals.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'interval-item';
                div.innerHTML = `
                    <input type="text" value="${item.name}" placeholder="Nama Sintaks" onchange="intervals[${idx}].name = this.value">
                    <input type="number" value="${item.h}" min="0" placeholder="J" onchange="intervals[${idx}].h = parseInt(this.value)||0">
                    <input type="number" value="${item.m}" min="0" max="59" placeholder="M" onchange="intervals[${idx}].m = parseInt(this.value)||0">
                    <input type="number" value="${item.s}" min="0" max="59" placeholder="D" onchange="intervals[${idx}].s = parseInt(this.value)||0">
                    <button class="btn-del" onclick="removeIntervalItem(${idx})">×</button>
                `;
                container.appendChild(div);
            });
        }

        function addIntervalItem() {
            intervals.push({ name: `Sintaks ${intervals.length + 1}`, h: 0, m: 10, s: 0 });
            renderIntervalInputs();
        }

        function removeIntervalItem(idx) {
            if (intervals.length > 1) {
                intervals.splice(idx, 1);
                renderIntervalInputs();
            }
        }

        function saveSettings() {
            isIntervalMode = document.getElementById('enableIntervals').checked;
            toggleTotalTimerVisibility();
            modalOverlay.classList.remove('active');
            resetTimer();
        }

        resetTimer();
    </script>
</body>
</html>
